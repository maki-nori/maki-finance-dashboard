  function wireTips(root){ root.querySelectorAll('[data-tip]').forEach(el=>tipOn(el, el.getAttribute('data-tip'))); }

  // A headline figure must never be cut off. The CSS size is a starting point only:
  // how wide "£1,942,953" actually draws depends on the reader's font, so measure the
  // rendered text against the tile it sits in and step the size down until it fits.
  // Runs after every render, on tab switch and on resize; tiles in a hidden tab have no
  // width to measure, which is why the tab switch re-runs it.
  function fitTiles(root){
    (root||document).querySelectorAll('.tiles .tile .tv').forEach(v=>{
      if(!v.offsetParent) return;
      v.style.fontSize = '';
      const room = () => v.clientWidth - 1;
      const text = () => { const r = document.createRange(); r.selectNodeContents(v);
                           return r.getBoundingClientRect().width; };
      if(room() <= 0) return;
      let f = parseFloat(getComputedStyle(v).fontSize) || 22;
      for(let i = 0; i < 60 && text() > room() && f > 11; i++){ f -= 0.5; v.style.fontSize = f + 'px'; }
    });
  }
  let fitT; addEventListener('resize', ()=>{ clearTimeout(fitT); fitT = setTimeout(()=>fitTiles(), 120); });
  const m1 = v => (v<0?'-':'')+'£'+(Math.abs(v)/1e6).toFixed(2)+'m';
  const k0 = v => (v<0?'-':'')+'£'+Math.round(Math.abs(v)/1e3).toLocaleString('en-GB')+'k';
  const pc1 = v => v==null ? '–' : (v>0?'+':'')+v.toFixed(1)+'%';
  const chip = (v, goodUp, fmt) => {
    if(v==null) return '<span class="chip2 flat">no comparison</span>';
    const good = goodUp ? v>0 : v<0;
    const cls = v===0 ? 'flat' : good ? 'up' : 'down';
    return `<span class="chip2 ${cls}">${fmt(v)}</span>`;
  };
  // arc gauge: one value against a target, hero number beside it
  function gauge(ratio, label, state){
    const r=34, C=2*Math.PI*r, frac=Math.max(0, Math.min(1.3, ratio||0));
    const col = state==='good' ? 'var(--good)' : state==='bad' ? 'var(--bad)' : 'var(--warn)';
    return `<svg class="plot" viewBox="0 0 84 84" style="width:84px;height:84px;flex:0 0 84px" role="img" aria-label="${esc(label)}">
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--neutral)" stroke-width="10"/>
      <circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${(Math.min(frac,1)*C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/>
    </svg>`;
  }
  // horizontal bar list; rows are clickable
  function barList(rows, opts){
    const mx = Math.max(...rows.map(r=>Math.abs(r.value)), 1);
    return rows.map(r=>{
      const col = r.value<0 ? 'var(--bad)' : (r.color||'var(--series-1)');
      const w = (Math.abs(r.value)/mx*100).toFixed(1);
      return `<div class="barrow" ${r.go?`data-go="${esc(r.go)}"`:''} data-tip="${esc(r.tip||'')}" tabindex="0">
        <div class="lb">${esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:''}</div>
        <div class="tr"><span class="fl" style="width:${w}%;background:${col}"></span></div>
        <div class="rt" style="${r.value<0?'color:var(--bad)':''}">${opts.fmt(r.value)}</div></div>`;
    }).join('');
  }

  // ---------------- TODAY ----------------
  const C = D.cash, L = D.leaving, M = D.ma, H = D.health, B = D.bep;
  (function(){
    let h = '<div class="viz">';

      { l: P?`Left at ${meLab}`:'Left at month end', v: P?gbp(P.closing):'–',

        state: !P?'':P.closing<C.alarm?'bad':'good',
        tip: P?`<b>Cash left at ${meLab}</b><br><span class="k">Today</span> £${Math.round(P.opening).toLocaleString('en-GB')}<br><span class="k">Money in, ${P.days_to_month_end} days</span> +£${Math.round(P.inflow).toLocaleString('en-GB')}<br><span class="k">Due out by ${meLab}</span> -£${Math.round(P.outflow).toLocaleString('en-GB')}${(P.out_by_category||[]).map(c=>`<br>&nbsp;&nbsp;<span class="k">${esc(c.category)}</span> £${Math.round(c.amount).toLocaleString('en-GB')}`).join('')}<br><span class="k">Left</span> £${Math.round(P.closing).toLocaleString('en-GB')}<br>Payroll leaves on the last day of the month, so it is inside this.`:'' },
      { l: (P&&P.next)?`Left at ${meShort(P.next.month_end)}`:'Left at next month end', v: (P&&P.next)?gbp(P.next.closing):'–',

      { l:`Sales, ${M?esc(M.latest_label):'latest month'}`, v:gbp(g.sales), s:`${chip(g.sales_delta,true,k0)} on ${M?esc(M.prior_label):'last month'}`, state:'',
        tip:`<b>Sales</b><br><span class="k">${M?esc(M.prior_label):''}</span> £${Math.round(gp.sales||0).toLocaleString('en-GB')}<br><span class="k">Year to date</span> £${Math.round(g.ytd_sales||0).toLocaleString('en-GB')}` },

      { l:'Wage cost', v:(g.wages_pct==null?'–':g.wages_pct.toFixed(1)+'%'), s:`${chip(g.wages_pct==null?null:g.wages_pct-wageT,false,v=>(v>0?'+':'')+v.toFixed(1)+'pp')} against the ${wageT}% target`,

    ];
    h += `<div class="tiles">` + tiles.map(t=>`<div class="tile ${t.state?'is-'+t.state:''}" data-tip="${esc(t.tip)}" tabindex="0">
      <div class="tl">${esc(t.l)}</div><div class="tv">${t.v}</div><div class="ts">${t.s}</div></div>`).join('') + `</div>`;

    // ---- road to the revenue target ----
    if(TG){
      const tm = v => '£'+(v/1e6).toFixed(2)+'m';
      const gap = TG.projection_seasonal==null ? null : TG.projection_seasonal - TG.target;
      h += `<div class="card"><h2>Road to ${tm(TG.target)} <small>revenue, ${TG.months_done} months done, ${TG.months_left} to go</small></h2>

            <div class="muted">${TG.projection_run_rate>=TG.target?'clears it':gbp(TG.target-TG.projection_run_rate)+' short'}</div></div>
          ${TG.projection_seasonal!=null?`<div class="kpi" data-tip="<b>Seasonal</b><br>Repeats last year's month-by-month shape from here, scaled by how ${esc((M&&M.latest_label)||'this month')} compared with the same month last year." tabindex="0">
            <div class="l">If the year repeats last year's shape</div><div class="v ${TG.projection_seasonal>=TG.target?'pos':'neg'}">${tm(TG.projection_seasonal)}</div>
            <div class="muted">${gap>=0?gbp(gap)+' clear':gbp(-gap)+' short'}</div></div>`:''}
          ${TG.prior_year_total?`<div class="kpi" data-tip="<b>Last year</b><br>Full-year revenue from the 2025 consolidated profit and loss." tabindex="0">
            <div class="l">All of 2025</div><div class="v">${tm(TG.prior_year_total)}</div>
            <div class="muted">${TG.ytd>TG.prior_year_total?'already passed':gbp(TG.prior_year_total-TG.ytd)+' to go to match it'}</div></div>`:''}
        </div>
        <div class="src">${esc(TG.basis)}</div></div>`;
    }

    // ---- month chart + the two gauges ----
    h += `<div class="grid2">`;
    h += `<div class="card"><h2 id="mchart-h">Revenue by month
        <span style="float:right"><span class="toggle" id="mtog">
          <button data-mode="yoy" class="on">2025 vs 2026</button><button data-mode="split">Sales split</button><button data-mode="margin">Margin</button></span></span></h2>
      <div id="mchart"></div></div>`;

    const foodState  = g.food_pct==null?'':g.food_pct<=foodT?'good':'bad';
    const closeState = !P?'':P.closing<C.alarm?'bad':'good';
    h += `<div>
      <div class="card"><h2>Where cash lands <small>${P?`by ${meLab}, the last day of the month, after payroll`:'at month end'}</small></h2>
        ${P?`<div class="walk">
          <div class="wk" data-tip="<b>Cash today</b><br>Snapshot ${esc(C.snapshot_date)}"><span class="wl">Today</span><span class="wv">${gbp(P.opening)}</span></div>
          <div class="wk" data-tip="<b>Money in</b><br>£${Math.round(P.inflow_30d).toLocaleString('en-GB')} actually landed in the bank over the last 30 days across ${P.companies_covered} companies, transfers between our own companies taken out. Carried forward at the same daily rate for the ${P.days_to_month_end} days left in the month."><span class="wl">Money in, ${P.days_to_month_end} days on last month's rate</span><span class="wv pos">+${gbp(P.inflow)}</span></div>
          <div class="wk" data-tip="<b>Money out</b><br>Everything the calendar expects between today and ${meLab}.${(P.out_by_category||[]).map(c=>`<br><span class='k'>${esc(c.category)}</span> £${Math.round(c.amount).toLocaleString('en-GB')}`).join('')}"><span class="wl">Money out, to ${meLab}</span><span class="wv neg">-${gbp(P.outflow)}</span></div>
          <div class="wk tot"><span class="wl">Lands near</span><span class="wv" style="color:${closeState==='bad'?'var(--bad)':'var(--good)'}">${gbp(P.closing)}</span></div>
        </div>
        <div class="src">${esc(P.basis)}</div>`:'<div class="muted">No projection: the bank feeds did not give enough to work from.</div>'}</div>
      <div class="card"><h2>Food cost <small>how much of the ${foodT}% allowance is used</small></h2>
        <div class="gauge">${gauge(g.food_pct==null?0:g.food_pct/foodT, 'food cost against target', foodState)}
          <div><div class="num" style="color:${foodState==='good'?'var(--good)':'var(--bad)'}">${g.food_pct==null?'–':g.food_pct.toFixed(1)+'%'}</div>
          <div class="muted">${g.food_pct==null?'':(g.food_pct<=foodT?`${(foodT-g.food_pct).toFixed(1)} points under target`:`${(g.food_pct-foodT).toFixed(1)} points over target`)}${M&&M.over_food?`<br>${M.over_food.length} site${M.over_food.length===1?'':'s'} over it.`:''}</div></div></div></div>
      <div class="card"><h2>Company health <small>${H?H.rows.length:0} companies</small></h2>
        ${H?`<div class="seg">
          ${['red','amber','green','unknown'].map(k=>{const n=(H.counts||{})[k]||0; const w=n/H.rows.length*100;
            const c={red:'var(--bad)',amber:'var(--warn)',green:'var(--good)',unknown:'var(--neutral)'}[k];
            return n?`<span style="width:${w}%;background:${c}"></span>`:''; }).join('')}
        </div><div class="seglab">
          <span><span class="dot red"></span>${(H.counts||{}).red||0} red</span>

      </div></div>`;
    h += `</div>`;

    // ---- break-even summary strip ----
    if(B){
      const pctRec = B.percent_recovered;

        <span style="float:right"><a href="#bep" class="muted" style="color:var(--orange-dk);font-weight:600;font-size:12.5px">Open Break-even</a></span></h2>

          <span style="width:${Math.max(0,100-(pctRec||0))}%;background:var(--neutral)" data-tip="<b>Still to earn back</b> £${Math.round(B.outstanding).toLocaleString('en-GB')}"></span></div>
        <div id="bepbars" style="margin-top:10px"></div>
        <div class="src">Cumulative management-accounts profit since each site opened, against what it cost to build. Click a site to open the Break-even tab. Source: ${esc(B.source)}.</div></div>`;
    }

    // ---- needs attention ----
    h += `<div class="card"><h2>Needs attention <small>${D.attention.length} items</small></h2>`;
    if(!D.attention.length) h += `<div class="muted">Nothing red or amber right now.</div>`;
    D.attention.forEach(a=>{ h += `<div class="li"><span class="pill ${a.level}">${a.level.toUpperCase()}</span><div class="who">${esc(a.company)}</div><div class="what">${esc(a.text)}</div></div>`; });
    h += `</div>`;

    // ---- cash by company + money out by category ----
    h += `<div class="grid2">
      <div class="card"><h2>Cash by company <small>snapshot ${fmtD(C.snapshot_date)} · click a row for its calendar</small></h2>
        <div id="cashbars"></div>
        <div class="src">Group ${gbp2(C.group_total)}, a simple sum with no intercompany elimination. Tide sits outside the headline: ${gbp(C.tide_total)} across all accounts.</div></div>
      <div class="card"><h2>Money out, next ${L.window_days} days</h2><div id="catbars"></div>
        <div class="src">${esc(L.basis)}</div></div></div>`;

    // ---- coming in ----
    const inc = Object.entries(D.incoming);
    let delTot=0, franTot=0, interTot=0;
    inc.forEach(([code,x])=>{ if(x.deliveroo) delTot+=x.deliveroo.avg_week; if(x.franchise) franTot+=x.franchise.total_180d; if(x.intercompany) interTot+=x.intercompany.total_90d; });
    h += `<div class="card"><h2>Coming in <small>patterns from the bank feed</small></h2><div class="row">
      <div class="kpi"><div class="l">Deliveroo, typical week</div><div class="v">${gbp(delTot)}</div></div>
      <div class="kpi"><div class="l">Franchise fees, last 180 days</div><div class="v">${gbp(franTot)}</div></div>
      <div class="kpi"><div class="l">Intercompany, last 90 days</div><div class="v">${gbp(interTot)}</div></div></div>
      <details style="margin-top:8px"><summary>By company</summary><div class="wrap"><table><thead><tr><th>Co</th><th>Deliveroo</th><th>Franchise</th><th>Intercompany (90d)</th></tr></thead><tbody>`;
    inc.forEach(([code,x])=>{
      h += `<tr><td><b>${esc(code)}</b></td>
        <td>${x.deliveroo?`${gbp(x.deliveroo.avg_week)}/wk, usually ${x.deliveroo.weekday}, next ${fmtD(x.deliveroo.next)}`:'<span class="muted">none</span>'}</td>
        <td>${x.franchise?`${gbp(x.franchise.total_180d)} from ${esc(x.franchise.from_.join(', '))}`:'<span class="muted">none</span>'}</td>
        <td>${x.intercompany?gbp(x.intercompany.total_90d):'<span class="muted">none</span>'}</td></tr>`;
    });
    h += `</tbody></table></div></details></div>`;

    h += `<div class="card"><h2>Daily cash dashboard <small>the existing 09:00 view, embedded</small></h2><iframe src="cash-dashboard.html" loading="lazy" title="Cash dashboard"></iframe></div>`;
    h += `<div class="card"><h2>Not yet on the board <small>named, never filled with zero</small></h2>`;
    D.gaps.forEach(gp2=>{ h += `<div class="li"><div class="who">${esc(gp2.company)}</div><div class="what muted">${esc(gp2.text)}</div></div>`; });
    h += `</div></div>`;
    const T = document.getElementById('tab-today');
    T.innerHTML = h;

    // ---- the month chart, drawn twice depending on the toggle ----
    const ser = (M && M.group_series) || {};
    function drawMonths(mode){
      const box = document.getElementById('mchart');
      const sales = ser.sales||[], np = ser.np||[];
      if(!sales.length){ box.innerHTML='<div class="muted">Not available.</div>'; return; }
      const W=1000, HGT=196, padL=6, padB=34, padT=18;
      if(mode==='yoy'){
        const prior = ((PY&&PY.lines)||{}).revenue || [];
        if(!prior.length){ box.innerHTML='<div class="muted">2025 is not loaded. Run extract_pl_2025.py.</div>'; return; }
        const byM = {}; prior.forEach(x=>byM[x.month]=x.value);
        const pts = sales.map(x=>({month:x.month, now:x.value, was:byM[x.month]??null}));
        const mx = Math.max(...pts.map(x=>Math.max(x.now, x.was||0)));
        const bw = (W - padL*2) / pts.length;
        const y = v => padT + (HGT-padT-padB) * (1 - v/mx);
        let sv = `<svg class="plot" viewBox="0 0 ${W} ${HGT}" preserveAspectRatio="none" style="height:210px" role="img" aria-label="Revenue by month, 2025 against 2026">`;
        pts.forEach((x,i)=>{
          const gw = bw*0.74, half = gw/2, x0 = padL + i*bw + bw*0.13;
          const base = y(0);
          const d2 = (x.was!=null && x.now) ? (x.now-x.was)/x.was*100 : null;
          sv += `<g class="col">`;

          sv += `<rect class="mk" x="${x0+half+2}" y="${y(x.now)}" width="${half-2}" height="${Math.max(1,base-y(x.now))}" fill="var(--series-1)" rx="4"/>
            <text class="val" x="${x0+half+2+(half-2)/2}" y="${y(x.now)-5}" text-anchor="middle">${m1(x.now)}</text>
            <text x="${x0+gw/2}" y="${HGT-14}" text-anchor="middle">${x.month}</text>
            ${d2!=null?`<text x="${x0+gw/2}" y="${HGT-3}" text-anchor="middle" fill="${d2<0?'var(--bad)':'var(--good)'}" style="font-weight:700">${d2>0?'+':''}${d2.toFixed(0)}%</text>`:''}
            <rect class="hit" x="${x0-bw*0.13}" y="0" width="${bw}" height="${HGT-padB}"
              data-tip="<b>${x.month}</b><br><span class='k'>2026</span> ${m1(x.now)}<br><span class='k'>2025</span> ${x.was==null?'not available':m1(x.was)}${d2!=null?`<br><span class='k'>Change</span> ${d2>0?'+':''}${d2.toFixed(1)}% (${k0(x.now-x.was)})`:''}"/></g>`;
        });
        const done = pts.filter(x=>x.was!=null);
        const sumNow = done.reduce((a,x)=>a+x.now,0), sumWas = done.reduce((a,x)=>a+x.was,0);
        box.innerHTML = sv + `</svg><div class="legend"><span><i style="background:var(--neutral)"></i>2025</span><span><i style="background:var(--series-1)"></i>2026</span>
          <span>Same months both years: ${m1(sumWas)} to ${m1(sumNow)}, <b style="color:var(--good)">+${((sumNow-sumWas)/sumWas*100).toFixed(0)}%</b></span></div>
          <div class="src">${esc(((PY&&PY.caveats)||[]).join(' '))}</div>`;
        wireTips(box);
        return;
      }
      if(mode==='margin'){
        const pts = sales.map((s,i)=>({month:s.month, v: np[i] && s.value ? np[i].value/s.value*100 : null}))

        sv += `<polyline fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
                 points="${pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}"/>`;
        pts.forEach((p,i)=>{
          sv += `<g class="col"><circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="${p.v<0?'var(--bad)':'var(--series-1)'}" stroke="#fff" stroke-width="2"/>
            <text class="val" x="${x(i)}" y="${y(p.v)-11}" text-anchor="middle" fill="${p.v<0?'var(--bad)':'var(--ink)'}">${p.v.toFixed(0)}%</text>
            <text x="${x(i)}" y="${HGT-8}" text-anchor="middle">${p.month}</text>
            <rect class="hit" x="${x(i)-28}" y="0" width="56" height="${HGT-padB}"
              data-tip="<b>${p.month} 2026</b><br><span class='k'>Margin</span> ${p.v.toFixed(1)}%<br><span class='k'>Sales</span> ${m1(sales[i].value)}<br><span class='k'>Net profit</span> ${k0(np[i].value)}"/></g>`;
        });
        box.innerHTML = sv + `</svg><div class="legend"><span><i style="background:var(--series-1)"></i>Net profit as a share of sales</span></div>
          <div class="src">Chart labels from the monthly analysis, so rounded.</div>`;
      } else {

        let sv = `<svg class="plot" viewBox="0 0 ${W} ${HGT}" preserveAspectRatio="none" style="height:200px" role="img" aria-label="Sales split into costs and net profit by month">`;
        sales.forEach((s,i)=>{

              data-tip="<b>${s.month} 2026</b><br><span class='k'>Sales</span> ${m1(s.value)}<br><span class='k'>Costs</span> ${m1(costs)}<br><span class='k'>Net profit</span> ${k0(p)} (${s.value?(p/s.value*100).toFixed(1):'0'}%)"/></g>`;

  // ---------------- CALENDAR ----------------
  const cal = D.calendar;
  const cats = [...new Set(cal.map(i=>i.category))];

  let cf = { co:'all', cat:new Set(cats), status:'open', q:'' };
  const cw = document.getElementById('tab-calendar');
  function renderCal(){
    let html = `<div class="card"><div class="filters">
      <select id="f-co"><option value="all">All companies</option>${cos.map(c=>`<option ${cf.co===c?'selected':''}>${c}</option>`).join('')}</select>

      <input type="search" id="f-q" placeholder="search" value="${esc(cf.q)}"></div>
      <div class="filters">${cats.map(c=>`<span class="chip ${cf.cat.has(c)?'on':''}" data-cat="${esc(c)}">${esc(c)}</span>`).join('')}</div>`;
    let rows = cal.filter(i => (cf.co==='all'||i.company===cf.co) && cf.cat.has(i.category)
      && (cf.status==='all' || (cf.status==='open' ? i.status!=='paid' : i.status==='overdue'))
      && (!cf.q || (i.company+' '+i.category+' '+i.note+' '+i.basis).toLowerCase().includes(cf.q.toLowerCase())));
    const overdue = rows.filter(i=>i.status==='overdue'), rest = rows.filter(i=>i.status!=='overdue');
    const in30 = rest.filter(i=>i.status==='due' && i.days>=0 && i.days<=D.leaving.window_days).reduce((s,i)=>s+i.amount,0);
    html += `<div class="row"><div class="kpi"><div class="l">Overdue</div><div class="v ${overdue.length?'neg':''}">${overdue.length}</div></div>
      <div class="kpi"><div class="l">Leaving in ${D.leaving.window_days} days (this filter)</div><div class="v">${gbp(in30)}</div></div>
      <div class="kpi"><div class="l">Items shown</div><div class="v">${rows.length}</div></div></div></div>`;
    const ev = i => `<div class="ev ${i.status}"><div class="code">${esc(i.company)}</div><div><div class="cat">${esc(i.category)} <span class="pill ${i.status==='overdue'?'red':i.status==='paid'?'green':i.status==='check'?'amber':'grey'}">${i.status}</span></div><div class="note">${esc(i.note)}</div></div><div><div class="amt">${gbp(i.amount)}</div><div class="basis">${esc(i.basis)}</div></div></div>`;
    if(overdue.length){ html += `<div class="day" style="color:var(--red)">Overdue, pinned</div>` + overdue.map(ev).join(''); }
    let last=null;
    rest.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:b.amount-a.amount).forEach(i=>{
      if(i.date!==last){ last=i.date; const dayTot = rest.filter(x=>x.date===i.date && x.status!=='paid').reduce((s,x)=>s+x.amount,0); html += `<div class="day">${fmtD(i.date)} <span class="muted">· ${rel(i.days)}${dayTot?' · '+gbp(dayTot)+' due':''}</span></div>`; }
      html += ev(i);
    });
    if(!rows.length) html += `<div class="muted">Nothing matches.</div>`;
    html += `<div class="src" style="margin-top:14px">Every date and amount comes from the pattern in that company's Xero bank feed (as at: ${esc(Object.entries(D.feed_as_at).map(([k,v])=>k+' '+v).join(', '))}). Actual = seen in the bank. Estimate = projected from the last payment. Check = no recent payment on record, confirm before relying on it. Corporation tax, Companies House filings and landlord rent from the rent register are not wired yet.</div>`;
    cw.innerHTML = html;
    cw.querySelector('#f-co').onchange = e=>{cf.co=e.target.value; renderCal();};
    cw.querySelector('#f-st').onchange = e=>{cf.status=e.target.value; renderCal();};
    cw.querySelector('#f-q').oninput = e=>{cf.q=e.target.value; renderCal(); cw.querySelector('#f-q').focus(); const el=cw.querySelector('#f-q'); el.setSelectionRange(el.value.length,el.value.length);};
    cw.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ const c=ch.dataset.cat; if(cf.cat.has(c)&&cf.cat.size>1) cf.cat.delete(c); else cf.cat.add(c); renderCal(); });
  }

        <div class="li"><div class="who">All</div><div class="what muted">The three-month loss rule needs three closed months of net profit. ${H.latest_ma_month?esc(H.latest_ma_month)+' and '+esc(H.prior_ma_month)+' are loaded':'none are loaded'}, so it shows as a watch, never red.</div></div></div>`;

  // ---------------- MANAGEMENT ACCOUNTS ----------------
  // Everything on this tab is worked out in the browser from D.mayears, which
  // carries every site, every month, every line as plain arrays. Nothing is
  // pre-aggregated, so any selection Michael makes gets a real answer rather
  // than the handful of cuts a build step happened to anticipate.
  (function(){
    const M = D.ma, Y = D.mayears, w = document.getElementById('tab-ma');
    if(!M && !Y){ w.innerHTML = '<div class="card muted">No management accounts in this build. Run extract_ma_history.py.</div>'; return; }
    if(!Y){ w.innerHTML = '<div class="card muted">No multi-year history yet. Click "Fetch MA History (2024-2026).command", then run finance_control_centre/extract_ma_annuals.py and rebuild.</div>'; return; }

    const S = Y.sites, MONTHS = Y.months;
    const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const foodT = (M && M.food_target) || 25, wageT = (M && M.wage_target) || 27;
    const pct1 = v => v==null ? '<span class="muted">–</span>' : v.toFixed(1)+'%';
    const money0 = v => v==null ? '<span class="muted">–</span>' : (v<0?'-':'')+'£'+Math.abs(Math.round(v)).toLocaleString('en-GB');
    const mlab = ym => MN[+ym.slice(5)-1] + ' ' + ym.slice(0,4);

    // ---- the selection ----
    const st = {
      period: MONTHS[MONTHS.length-1],     // a month, or ytd:YYYY / fy:YYYY / l12
      compare: 'yoy',                      // yoy | prev | none
      group: 'site',                       // site | region | cohort
      lfl: false,
      picked: null,                        // null = every counted site
      metric: 'sales',
      chart: 'season',                     // season (years overlaid) | run (whole timeline)
    };

    const counted = Y.counted.filter(c=>S[c]);
    const nameOf = c => (S[c]&&S[c].name) || c;
    const groupOf = c => st.group==='region' ? (S[c].region||'Unassigned')
                       : st.group==='cohort' ? (Y.cohort_labels[S[c].cohort]||'Unassigned') : c;
    const picked = () => (st.picked && st.picked.length ? st.picked : counted);

    function val(code, line, ym){
      const s = S[code]; if(!s) return null;
      const y = s.y[ym.slice(0,4)]; if(!y) return null;
      const a = y[line]; if(!a) return null;
      const v = a[+ym.slice(5)-1];
      return v==null ? null : v;
    }
    const trading = (code, ym) => val(code,'sales',ym)!=null;

    function monthsOf(sel){
      if(sel.startsWith('ytd:')){ const y=sel.slice(4); return MONTHS.filter(m=>m.startsWith(y)); }
      if(sel.startsWith('fy:')){ const y=sel.slice(3); return MONTHS.filter(m=>m.startsWith(y)); }
      if(sel==='l12'){ return MONTHS.slice(-12); }
      return [sel];
    }
    const shiftYear = (ym,n) => (+ym.slice(0,4)+n) + ym.slice(4);
    function compareMonths(sel){
      if(st.compare==='none') return [];
      const cur = monthsOf(sel);
      if(st.compare==='yoy') return cur.map(m=>shiftYear(m,-1)).filter(m=>MONTHS.includes(m));
      const i = MONTHS.indexOf(cur[0]);
      const n = cur.length, start = i-n;
      return start<0 ? [] : MONTHS.slice(start, start+n);
    }

    // like-for-like: only sites trading in EVERY month of both windows
    function eligible(cur, cmp){
      let codes = picked();
      if(!st.lfl) return codes;
      const need = cur.concat(cmp);
      return codes.filter(c=>need.every(m=>trading(c,m)));
    }
    function total(codes, line, months){
      let v=null;
      codes.forEach(c=>months.forEach(m=>{ const x=val(c,line,m); if(x!=null) v=(v||0)+x; }));
      return v;
    }
    const rate = (codes, line, months) => {
      const s = total(codes,'sales',months), v = total(codes,line,months);
      return (s && v!=null) ? v/s*100 : null;
    };

    const LINES = [
      {k:'sales', label:'Sales', hd:true},
      {k:'wages', label:'Wages', rate:true, target:wageT},
      {k:'rent',  label:'Rent', rate:true},
      {k:'food',  label:'Food costs', rate:true, target:foodT},
      {k:'variable', label:'Variable costs', rate:true},
      {k:'vat',   label:'VAT', rate:true},
      {k:'total_costs', label:'Total costs', hd:true},
      {k:'np',    label:'Net profit', hd:true, sign:true, rate:true},
    ];
    const METRICS = [
      {k:'sales', label:'Sales', fmt:money0},
      {k:'np', label:'Net profit', fmt:money0, sign:true},
      {k:'np_pct', label:'Net profit %', fmt:pct1, isRate:true, of:'np'},
      {k:'wages_pct', label:'Wage cost %', fmt:pct1, isRate:true, of:'wages', target:wageT, lower:true},
      {k:'food_pct', label:'Food cost %', fmt:pct1, isRate:true, of:'food', target:foodT, lower:true},
      {k:'wages', label:'Wages', fmt:money0},
      {k:'food', label:'Food costs', fmt:money0},
    ];
    const metric = () => METRICS.find(m=>m.k===st.metric) || METRICS[0];
    function metricValue(codes, months){
      const m = metric();
      return m.isRate ? rate(codes, m.of, months) : total(codes, m.k, months);
    }

    // ---- a small inline chart, no library ----
    function lineChart(series, opts){
      const W=760, H=210, padL=54, padR=12, padT=10, padB=24;
      const xs = opts.x, n = xs.length;
      let lo=Infinity, hi=-Infinity;
      series.forEach(s=>s.v.forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v); }}));
      if(!isFinite(lo)) return '<div class="muted">Nothing to plot for this selection.</div>';
      if(opts.zero!==false) lo = Math.min(lo, 0);
      if(hi===lo) hi = lo + 1;
      const pad=(hi-lo)*0.08; hi+=pad; lo-= (lo<0?pad:0);
      const px = i => padL + (n===1?0:i*(W-padL-padR)/(n-1));
      const py = v => padT + (hi-v)/(hi-lo)*(H-padT-padB);
      const ticks = 4, tv = [];
      for(let i=0;i<=ticks;i++) tv.push(lo + (hi-lo)*i/ticks);
      let g = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(opts.title||'chart')}">`;
      tv.forEach(v=>{ const y=py(v);
        g += `<line x1="${padL}" x2="${W-padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/>`
           + `<text x="${padL-7}" y="${(y+3.5).toFixed(1)}" class="ax" text-anchor="end">${opts.fmtY(v)}</text>`; });
      if(lo<0){ const y=py(0); g += `<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" class="zero"/>`; }
      xs.forEach((lab,i)=>{ if(n>14 && i%Math.ceil(n/12)) return;
        g += `<text x="${px(i).toFixed(1)}" y="${H-7}" class="ax" text-anchor="middle">${esc(lab)}</text>`; });
      series.forEach(s=>{
        let d='', started=false;
        s.v.forEach((v,i)=>{ if(v==null){ started=false; return; }
          d += (started?'L':'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1) + ' '; started=true; });
        if(d) g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}"${s.dash?` stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
        s.v.forEach((v,i)=>{ if(v==null) return;
          g += `<circle cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="${s.w===3?3.2:2.4}" fill="${s.color}"><title>${esc(s.name)} ${esc(xs[i])}: ${opts.fmtT(v)}</title></circle>`; });
      });
      g += `</svg>`;
      return `<div class="chartwrap">${g}</div><div class="legend">` + series.map(s=>
        `<span><i style="background:${s.color};${s.dash?'opacity:.85':''}"></i>${esc(s.name)}</span>`).join('') + `</div>`;
    }
    const SERIES_COL = ['var(--series-1)','#6f6a5e','#a9a396','#c9c4b8'];
    const SERIES_DASH = [null, null, '6 4', '2 4'];
    // a headline delta reads better in millions once it is one
    const kd = v => Math.abs(v) >= 1e6 ? (v<0?'-':'')+'£'+(Math.abs(v)/1e6).toFixed(2)+'m' : k0(v);

    // ---- render ----
    function draw(){
      const cur = monthsOf(st.period), cmp = compareMonths(st.period);
      const codes = eligible(cur, cmp);
      const dropped = picked().filter(c=>!codes.includes(c));
      const periodLab = st.period.startsWith('ytd:') ? `January to ${mlab(cur[cur.length-1]).split(' ')[0]} ${st.period.slice(4)}`
        : st.period.startsWith('fy:') ? `${st.period.slice(3)}, full year`
        : st.period==='l12' ? `${mlab(cur[0])} to ${mlab(cur[cur.length-1])}`
        : mlab(st.period);
      const cmpLab = !cmp.length ? null
        : (st.compare==='yoy' ? (cur.length>1 ? `the same months in ${cmp[0].slice(0,4)}` : mlab(cmp[0]))
                              : (cmp.length>1 ? `${mlab(cmp[0])} to ${mlab(cmp[cmp.length-1])}` : mlab(cmp[0])));

      let x = '<div class="viz">';

      // ---- controls ----
      const monthOpts = MONTHS.slice().reverse().map(m=>`<option value="${m}"${st.period===m?' selected':''}>${esc(mlab(m))}</option>`).join('');
      const years = Y.years.slice().reverse();
      x += `<div class="card ctlcard"><div class="ctls">
        <label class="ctl"><span>Period</span><select id="mPeriod">
          <optgroup label="One month">${monthOpts}</optgroup>
          <optgroup label="Longer">
            ${years.map(y=>`<option value="ytd:${y}"${st.period==='ytd:'+y?' selected':''}>${y} year to date</option>`).join('')}
            ${years.map(y=>`<option value="fy:${y}"${st.period==='fy:'+y?' selected':''}>${y} full year</option>`).join('')}
            <option value="l12"${st.period==='l12'?' selected':''}>Last 12 months</option>
          </optgroup></select></label>
        <label class="ctl"><span>Compare with</span><select id="mCompare">
          <option value="yoy"${st.compare==='yoy'?' selected':''}>Same period last year</option>
          <option value="prev"${st.compare==='prev'?' selected':''}>The period before</option>
          <option value="none"${st.compare==='none'?' selected':''}>Nothing</option></select></label>
        <label class="ctl"><span>Columns</span><select id="mGroup">
          <option value="site"${st.group==='site'?' selected':''}>One per site</option>
          <option value="region"${st.group==='region'?' selected':''}>By region</option>
          <option value="cohort"${st.group==='cohort'?' selected':''}>M1-M10 against the rest</option></select></label>
        <label class="ctl"><span>Basis</span><select id="mLfl">
          <option value="0"${!st.lfl?' selected':''}>Every site in the selection</option>
          <option value="1"${st.lfl?' selected':''}>Like for like only</option></select></label>
      </div>
      <div class="filters" style="margin-top:8px">
        <span class="chip ${!st.picked?'on':''}" data-set="all">All ${counted.length} sites</span>
        ${Object.keys(Y.cohort_labels||{}).filter(k=>counted.some(c=>S[c].cohort===k)).map(k=>`<span class="chip ${st.picked&&st.picked.join()===counted.filter(c=>S[c].cohort===k).join()?'on':''}" data-set="cohort:${esc(k)}">${esc(Y.cohort_labels[k])}</span>`).join('')}
        ${Y.regions.map(r=>`<span class="chip ${st.picked&&st.picked.join()===counted.filter(c=>S[c].region===r).join()?'on':''}" data-set="region:${esc(r)}">${esc(r)}</span>`).join('')}
      </div>
      <div class="filters sitepick">
        ${counted.map(c=>`<span class="chip sm ${picked().includes(c)?'on':''}" data-site="${esc(c)}" data-tip="<b>${esc(c)}</b> ${esc(nameOf(c))}<br>${esc(S[c].region||'')}">${esc(c)}</span>`).join('')}
      </div>
      <div class="src">Click a site to add or drop it. ${st.lfl?'Like for like counts only sites trading in every month of both periods':'Every selected site counts, so a period with new openings in it grows partly because of them'}.
        ${dropped.length?`<b>Out of this comparison:</b> ${dropped.map(esc).join(', ')}.`:''}</div></div>`;

      // ---- headline ----
      const tiles = [
        {k:'sales', label:'Sales', fmt:money0},
        {k:'np', label:'Net profit', fmt:money0, sign:true},
        {k:'np_pct', label:'Net profit %', rate:'np', fmt:pct1},
        {k:'wages_pct', label:'Wage cost %', rate:'wages', fmt:pct1, target:wageT},
        {k:'food_pct', label:'Food cost %', rate:'food', fmt:pct1, target:foodT},
        {k:'rent_pct', label:'Rent %', rate:'rent', fmt:pct1},
      ];
      x += `<div class="tiles">` + tiles.map(t=>{
        const now = t.rate ? rate(codes,t.rate,cur) : total(codes,t.k,cur);
        const was = cmp.length ? (t.rate ? rate(codes,t.rate,cmp) : total(codes,t.k,cmp)) : null;
        let sub = '<span class="muted">no comparison</span>';
        if(was!=null && now!=null){
          const d = now-was;
          sub = t.rate ? `${chip(d,false,v=>(v>0?'+':'')+v.toFixed(1)+'pp')} on ${esc(cmpLab)}`
                       : `${chip(d,true,kd)} ${was?'('+(d>=0?'+':'')+(d/Math.abs(was)*100).toFixed(0)+'%)':''} on ${esc(cmpLab)}`;
        }
        const state = t.target!=null && now!=null ? (now<=t.target?'good':'bad')
                    : (t.sign && now!=null ? (now>=0?'good':'bad') : '');
        return `<div class="tile ${state?'is-'+state:''}" data-tip="<b>${esc(t.label)}</b><br><span class='k'>${esc(periodLab)}</span> ${t.fmt(now)}${was!=null?`<br><span class='k'>${esc(cmpLab)}</span> ${t.fmt(was)}`:''}${t.target!=null?`<br><span class='k'>Target</span> ${t.target}%`:''}<br><span class='k'>Sites</span> ${codes.length}" tabindex="0">
          <div class="tl">${esc(t.label)}</div><div class="tv">${t.fmt(now)}</div><div class="ts">${sub}</div></div>`;
      }).join('') + `</div>`;

      // ---- the chart ----
      const m = metric();
      x += `<div class="card"><h2>${esc(m.label)} over time <small>${st.chart==='season'?'each year laid over the same months':'month by month, straight through'}</small></h2>
        <div class="filters" style="margin-bottom:6px">
          ${METRICS.map(o=>`<span class="chip sm ${st.metric===o.k?'on':''}" data-metric="${o.k}">${esc(o.label)}</span>`).join('')}
          <span class="chip sm ${st.chart==='season'?'on':''}" data-chart="season" style="margin-left:10px">Years overlaid</span>
          <span class="chip sm ${st.chart==='run'?'on':''}" data-chart="run">Straight through</span>
        </div>`;
      const fmtY = v => m.isRate ? v.toFixed(0)+'%' : (Math.abs(v)>=1e6 ? '£'+(v/1e6).toFixed(1)+'m' : k0(v));
      const fmtT = v => m.isRate ? v.toFixed(1)+'%' : money0(v).replace(/<[^>]+>/g,'');
      if(st.chart==='season'){
        const series = Y.years.slice().reverse().map((yr,i)=>({
          name: yr, color: SERIES_COL[i]||'#bbb', dash: SERIES_DASH[i], w: i===0?3:2,
          v: MN.map((_,mi)=>{
            const ym = `${yr}-${String(mi+1).padStart(2,'0')}`;

        x += lineChart([{name:m.label, color:'var(--series-1)', w:2.4,
          v: MONTHS.map(ym=>metricValue(codes,[ym]))}],
          {x:MONTHS.map(ym=>MN[+ym.slice(5)-1]+(ym.endsWith('-01')?" '"+ym.slice(2,4):'')), fmtY, fmtT, title:m.label});
      }
      x += `<div class="src">${codes.length} site${codes.length===1?'':'s'}: ${codes.map(esc).join(', ')}.
        ${m.isRate?'A rate over several sites is their pounds added up, then divided, not an average of averages.':''}</div></div>`;

      // ---- the matrix ----
      const groups = [];
      if(st.group==='site'){ codes.forEach(c=>groups.push({key:c, label:c, sub:nameOf(c).slice(0,16), codes:[c]})); }
      else {
        const byG = {};
        codes.forEach(c=>{ const g=groupOf(c); (byG[g]=byG[g]||[]).push(c); });
        Object.keys(byG).sort().forEach(g=>groups.push({key:g, label:g, sub:byG[g].length+' sites', codes:byG[g]}));
      }
      x += `<div class="card"><h2>${esc(periodLab)}${cmpLab?` against ${esc(cmpLab)}`:''} <small>the workbook layout, ${st.group==='site'?'sites':'groups'} across</small></h2>
        <div class="wrap"><table class="matrix"><thead><tr><th class="l stick"></th>
        ${groups.map(g=>`<th class="n">${esc(g.label)}</th>`).join('')}<th class="n tot">Total</th></tr></thead>
        <tr class="names"><th class="l stick"></th>${groups.map(g=>`<td class="n muted">${esc(g.sub)}</td>`).join('')}<td class="n tot muted">${codes.length} sites</td></tr><tbody>`;
      LINES.forEach(ln=>{
        const cells = g2 => {
          const now = total(g2, ln.k, cur);
          const was = cmp.length ? total(g2, ln.k, cmp) : null;
          const r = ln.rate ? rate(g2, ln.k, cur) : null;
          let cls = 'n';
          if(ln.sign && now!=null && now<0) cls += ' bad';
          if(ln.target && r!=null) cls += r>ln.target ? ' bad' : ' good';
          const dl = (was!=null && now!=null) ? `<br><span class='k'>${esc(cmpLab)}</span> ${money0(was).replace(/<[^>]+>/g,'')}${was?` (${((now-was)/Math.abs(was)*100).toFixed(1)}%)`:''}` : '';
          return `<td class="${cls}" data-tip="<b>${esc(ln.label)}</b><br><span class='k'>${esc(periodLab)}</span> ${money0(now).replace(/<[^>]+>/g,'')}${r!=null?`<br><span class='k'>of sales</span> ${r.toFixed(2)}%`:''}${dl}">${money0(now)}${r!=null?`<span class="sub2">${r.toFixed(1)}%</span>`:''}</td>`;
        };
        x += `<tr class="${ln.hd?'hd':''}"><th class="l stick">${esc(ln.label)}</th>`
           + groups.map(g=>cells(g.codes)).join('')
           + `<td class="n tot">${money0(total(codes,ln.k,cur))}${ln.rate?`<span class="sub2">${(rate(codes,ln.k,cur)||0).toFixed(1)}%</span>`:''}</td></tr>`;
      });
      x += `</tbody></table></div><div class="src">Percentages under each figure are that column's share of its own sales. ${esc(Y.note)}</div></div>`;

      // ---- site by site against last year ----
      if(cmp.length){
        const rows = picked().map(c=>{
          const now = metricValue([c],cur), was = metricValue([c],cmp);
          return {c, now, was, d:(now!=null&&was!=null)?now-was:null,
                  pcChange:(now!=null&&was&&Math.abs(was)>0)?(now-was)/Math.abs(was)*100:null,
                  lfl: cur.concat(cmp).every(mm=>trading(c,mm))};
        }).filter(r=>r.now!=null||r.was!=null);
        rows.sort((a,b)=> (b.d==null?-1e15:b.d) - (a.d==null?-1e15:a.d));
        const mx = Math.max(1, ...rows.map(r=>Math.abs(r.d==null?0:r.d)));
        x += `<div class="card"><h2>Every site, ${esc(periodLab)} against ${esc(cmpLab)} <small>${esc(m.label)}</small></h2>`;
        rows.forEach(r=>{
          const w2 = r.d==null?0:Math.abs(r.d)/mx*50;
          x += `<div class="barrow" style="grid-template-columns:150px 1fr 190px" data-tip="<b>${esc(r.c)}</b> ${esc(nameOf(r.c))}<br><span class='k'>${esc(periodLab)}</span> ${r.now==null?'not trading':fmtT(r.now)}<br><span class='k'>${esc(cmpLab)}</span> ${r.was==null?'not trading':fmtT(r.was)}<br><span class='k'>Region</span> ${esc(S[r.c].region||'–')}" tabindex="0">
            <div class="lb">${esc(r.c)}<small>${esc(nameOf(r.c).slice(0,18))}${r.lfl?'':(r.now==null?' · not trading now':' · not open all of last year')}</small></div>
            <div class="tr2"><span class="mid"></span>
              ${r.d!=null?`<span class="fl2" style="left:${r.d>=0?50:50-w2}%;width:${w2}%;background:var(--${r.d>=0?'good':'bad'})"></span>`:''}</div>
            <div class="rt">${r.now==null?'<span class="muted">not trading</span>':fmtT(r.now)}
              <small style="display:block;font-weight:400;color:var(--mute);font-size:10.5px">${r.d==null?(r.was==null?'no figure last year':'nothing this period'):(m.isRate?((r.d>0?'+':'')+r.d.toFixed(1)+'pp'):((r.d>=0?'+':'-')+'£'+Math.abs(Math.round(r.d)).toLocaleString('en-GB')+(r.pcChange!=null?` (${r.pcChange>=0?'+':''}${r.pcChange.toFixed(0)}%)`:'')))}</small></div></div>`;
        });
        x += `<div class="src">Bars run either side of the middle line: right is up on ${esc(cmpLab)}, left is down. A site that was not trading in one of the two windows has no bar${st.lfl?', and is out of every total above':''}.</div></div>`;
      }

      // ---- what to know before acting ----
      x += `<div class="card"><h2>Read this before you act on a number</h2>`;
      (Y.overrides||[]).forEach(o=>{ x += `<div class="li"><span class="pill amber">CHECK</span><div class="who">${esc(o.code)}</div><div class="what">${esc(mlab(o.month))} ${esc(o.line==='np'?'net profit':o.line)}: the annual workbook says ${money0(o.workbook).replace(/<[^>]+>/g,'')}, Monica's published dashboard says ${money0(o.banked).replace(/<[^>]+>/g,'')}. The dashboard figure is the one shown.</div></div>`; });
      (M&&M.flags||[]).forEach(f=>{ x += `<div class="li"><span class="pill ${f.level}">${f.level.toUpperCase()}</span><div class="who">${esc(f.code)}</div><div class="what">${esc(f.text)}</div></div>`; });
      x += `<div class="li"><div class="who">Not counted</div><div class="what muted">${(Y.not_counted||[]).map(c=>`${esc(c)} (${esc((S[c]&&S[c].kind)||'other')})`).join(', ')} sit outside every total here: the factory, the property company, closed sites, and Dubai, which reports in dirhams.</div></div>`;
      if((Y.rejected||[]).length) x += `<div class="li"><div class="who">No history</div><div class="what muted">These Drive files had no management-account layout inside, so nothing was taken from them: ${(Y.rejected||[]).map(r=>esc(r.split(':')[0])).join(', ')}. The factory, the property master list and Nottingham's savings sheet are not management accounts.</div></div>`;
      x += `<div class="li"><div class="who">Source</div><div class="what muted">${esc(Y.source)} Built ${esc(Y.built)}. ${esc(Y.note)}</div></div></div>`;

      x += `</div>`;
      w.innerHTML = x;
      wireTips(w);
      fitTiles();

      const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onchange = fn; };
      on('mPeriod', e=>{ st.period = e.target.value; draw(); });
      on('mCompare', e=>{ st.compare = e.target.value; draw(); });
      on('mGroup', e=>{ st.group = e.target.value; draw(); });
      on('mLfl', e=>{ st.lfl = e.target.value==='1'; draw(); });
      w.querySelectorAll('[data-metric]').forEach(el=>el.onclick=()=>{ st.metric = el.dataset.metric; draw(); });
      w.querySelectorAll('[data-chart]').forEach(el=>el.onclick=()=>{ st.chart = el.dataset.chart; draw(); });
      w.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{
        const s = el.dataset.set;
        st.picked = s==='all' ? null
          : s.startsWith('cohort:') ? counted.filter(c=>S[c].cohort===s.slice(7))
          : counted.filter(c=>S[c].region===s.slice(7));
        draw();
      });
      w.querySelectorAll('[data-site]').forEach(el=>el.onclick=()=>{
        const c = el.dataset.site, cur2 = picked().slice();
        const i = cur2.indexOf(c);
        if(i>=0) cur2.splice(i,1); else cur2.push(c);
        st.picked = cur2.length ? counted.filter(x2=>cur2.includes(x2)) : null;
        draw();
      });
    }
    draw();
  })();

  // ---------------- BREAK-EVEN ----------------
  (function(){
    const B = D.bep, w = document.getElementById('tab-bep');
    if(!B){ w.innerHTML = '<div class="card muted">No break-even data. Run extract_analysis_docx.py after the monthly Financial Analysis document lands in the project folder.</div>'; return; }
    const M = D.ma;
    const latestNP = {}; ((M&&M.sites)||[]).forEach(r=>{ latestNP[r.code] = r.np; });
    const asOf = (M && M.latest_month) ? M.latest_month : B.period;
    const monthsTrading = (start, prec) => {
      if(!start || !asOf || prec==='year') return null;
      const a = new Date(start+'T00:00:00'), b = new Date(asOf+'-01T00:00:00');
      const m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + 1;
      return m>0 ? m : null;
    };
    let bf = { show:'all' };

    function rowsFor(){
      const rows = B.rows.filter(r=>r.capex).map(r=>{
        const mt = monthsTrading(r.start, r.start_precision);
        const done = r.done != null ? r.done : ((r.profit_to_date||0) >= r.capex || r.fully_recovered);
        const outstanding = done ? 0 : Math.max(0, r.capex - (r.profit_to_date||0));
        const run = latestNP[r.code];
        const avg = (mt && r.profit_to_date!=null) ? r.profit_to_date/mt : null;
        const monthsLeftRun = (run && run>0 && outstanding>0) ? outstanding/run : null;
        const monthsLeftAvg = (avg && avg>0 && outstanding>0) ? outstanding/avg : null;
        return {...r, months_trading:mt, outstanding, run, avg, monthsLeftRun, monthsLeftAvg, done,
                pct_display: done ? 100 : (r.bep_pct==null?null:r.bep_pct)};
      });
      rows.sort((a,b2)=> (b2.pct_display??-1e9) - (a.pct_display??-1e9));
      return rows;
    }
    const R = rowsFor();
    const band = r => r.done ? 'done' : (r.bep_pct||0) < 0 ? 'behind' : (r.bep_pct||0) >= 50 ? 'over' : 'under';
    const bandLab = {done:'Paid back', over:'Over halfway', under:'Under way', behind:'Still going backwards'};
    const bandCol = {done:'var(--good)', over:'var(--series-1)', under:'var(--series-1-soft)', behind:'var(--bad)'};

    function draw(){
      const counts = {done:0,over:0,under:0,behind:0}; R.forEach(r=>counts[band(r)]++);
      const shown = R.filter(r=>bf.show==='all'||band(r)===bf.show);
      const newSites = R.filter(r=>r.start && r.start >= '2025-06-01');
      const newCapex = newSites.reduce((s2,r)=>s2+r.capex,0);
      const newRec  = newSites.reduce((s2,r)=>s2+(r.profit_to_date||0),0);

      let x = `<div class="viz">`;
      x += `<div class="tiles">
        <div class="tile" data-tip="<b>Total build cost</b><br>${B.sites_with_capex} sites with a figure on record.<br>No figure yet for ${esc((B.sites_without_capex||[]).join(', '))}." tabindex="0">
          <div class="tl">Total spent building</div><div class="tv">${gbp(B.total_capex)}</div><div class="ts">${B.sites_with_capex} sites on record</div></div>
        <div class="tile is-good" data-tip="<b>Earned back</b><br>Cumulative management-accounts profit since each site opened.${(B.capped_codes||[]).length?`<br>${esc((B.capped_codes||[]).join(', '))} ${(B.capped_codes||[]).length>1?'are':'is'} recorded as fully recovered, so ${(B.capped_codes||[]).length>1?'they count':'it counts'} for the whole build cost: £${Math.round(B.total_profit_on_record).toLocaleString('en-GB')} of profit on record plus £${Math.round(B.capped_amount).toLocaleString('en-GB')}.`:''}" tabindex="0">
          <div class="tl">Earned back</div><div class="tv">${gbp(B.total_recovered)}</div><div class="ts">${B.percent_recovered.toFixed(1)}% of what was spent</div></div>
        <div class="tile" data-tip="<b>Still to earn back</b><br>Build cost less profit made so far." tabindex="0">
          <div class="tl">Still to earn back</div><div class="tv">${gbp(B.outstanding)}</div><div class="ts">across ${R.filter(r=>!r.done).length} sites</div></div>
        <div class="tile is-good" data-tip="<b>Paid back</b><br>Sites whose profit since opening now covers what they cost to build." tabindex="0">
          <div class="tl">Paid back</div><div class="tv">${counts.done}</div><div class="ts">of ${R.length} sites</div></div>
        <div class="tile" data-tip="<b>Opened since June 2025</b><br>${esc(newSites.map(r=>r.code).join(', '))}" tabindex="0">
          <div class="tl">New sites, spent</div><div class="tv">${gbp(newCapex)}</div><div class="ts">${newSites.length} opened since June 2025</div></div>
        <div class="tile ${newRec<0?'is-bad':''}" data-tip="<b>New sites, earned back</b><br>The same ${newSites.length} sites' profit since opening." tabindex="0">
          <div class="tl">New sites, earned back</div><div class="tv">${gbp(newRec)}</div><div class="ts">${newCapex?(newRec/newCapex*100).toFixed(1):'0'}% of their build cost</div></div>
      </div>`;

      x += `<div class="card"><h2>The whole estate <small>build cost against profit since opening</small></h2>
        <div class="seg" style="height:22px">
          <span style="width:${Math.min(100,B.percent_recovered)}%;background:var(--series-1)"
            data-tip="<b>Earned back</b> £${Math.round(B.total_recovered).toLocaleString('en-GB')}"></span>
          <span style="width:${Math.max(0,100-B.percent_recovered)}%;background:var(--neutral)"
            data-tip="<b>Still to earn back</b> £${Math.round(B.outstanding).toLocaleString('en-GB')}"></span></div>
        <div class="seglab"><span><span class="dot" style="background:var(--series-1)"></span>Earned back ${gbp(B.total_recovered)} (${B.percent_recovered.toFixed(1)}%)</span>
          <span><span class="dot" style="background:var(--neutral)"></span>Still to earn back ${gbp(B.outstanding)}</span></div>
        <div class="src">${esc(B.note)}${(B.capped_codes||[]).length?` ${esc((B.capped_codes||[]).join(', '))} ${(B.capped_codes||[]).length>1?'are':'is'} recorded as fully recovered, so ${(B.capped_codes||[]).length>1?'they are':'it is'} counted at the full build cost rather than at the profit figure on record.`:''} Source: ${esc(B.source)}, as at ${esc(B.period)}.</div></div>`;

      x += `<div class="card"><div class="filters">
        ${['all','done','over','under','behind'].map(k=>`<span class="chip ${bf.show===k?'on':''}" data-show="${k}">${k==='all'?`All ${R.length}`:bandLab[k]+' '+counts[k]}</span>`).join('')}
      </div><h2 style="margin-top:4px">By site <small>how much of the build cost each one has earned back</small></h2>`;
      shown.forEach(r=>{
        const p = r.done ? 100 : Math.max(-100, Math.min(100, r.bep_pct||0));
        const col = bandCol[band(r)];
        // prefer the site's own monthly average; fall back to the latest month when the
        // start date is too vague to average over; say plainly when neither applies
        let eta;
        if(r.done) eta = 'Paid back';
        else if(r.monthsLeftAvg!=null) eta = r.monthsLeftAvg<=120 ? `about ${Math.ceil(r.monthsLeftAvg)} more months at its own average` : 'more than 10 years at its average so far';
        else if(r.monthsLeftRun!=null) eta = r.monthsLeftRun<=120 ? `about ${Math.ceil(r.monthsLeftRun)} more months at ${(M&&M.latest_label)||'this month'}'s profit` : `more than 10 years at ${(M&&M.latest_label)||'this month'}'s profit`;
        else eta = (r.run!=null && r.run<=0) ? 'losing money, so not paying itself back yet' : 'no profit figure to project from';
        x += `<div class="barrow" style="grid-template-columns:104px 1fr 150px" data-tip="<b>${esc(r.code)}</b><br><span class='k'>Build cost</span> £${Math.round(r.capex).toLocaleString('en-GB')}<br><span class='k'>Profit since opening</span> £${Math.round(r.profit_to_date||0).toLocaleString('en-GB')}<br><span class='k'>Still to earn</span> ${r.done?'nothing, paid back':'£'+Math.round(r.outstanding).toLocaleString('en-GB')}<br><span class='k'>Trading</span> ${r.months_trading?r.months_trading+' months from '+esc(r.start):(r.start_precision==='year'?'since '+esc(r.start.slice(0,4))+', exact date not given':'start date not given')}<br><span class='k'>${esc((M&&M.latest_label)||'Latest month')}</span> ${r.run==null?'no figure':'£'+Math.round(r.run).toLocaleString('en-GB')}" tabindex="0">
          <div class="lb">${esc(r.code)}<small>${r.months_trading?r.months_trading+' month'+(r.months_trading===1?'':'s')+' trading':(r.start_precision==='year'?'trading since '+esc(r.start.slice(0,4)):'start date unknown')}</small></div>
          <div class="tr" style="height:18px">${p>=0
            ? `<span class="fl" style="width:${p}%;background:${col}"></span>`
            : `<span class="fl" style="width:${Math.min(28,Math.abs(p))}%;background:var(--bad)"></span>`}</div>
          <div class="rt" style="${(r.bep_pct||0)<0?'color:var(--bad)':''}">${r.done?'100%':(r.bep_pct==null?'–':r.bep_pct.toFixed(1)+'%')}<small style="display:block;font-weight:400;color:var(--mute);font-size:10.5px">${esc(eta)}</small></div></div>`;
      });
      if(!shown.length) x += `<div class="muted">Nothing in that band.</div>`;
      x += `<div class="legend" style="margin-top:10px">
        <span><i style="background:var(--good)"></i>Paid back</span>
        <span><i style="background:var(--series-1)"></i>Over halfway</span>
        <span><i style="background:var(--series-1-soft)"></i>Under way</span>
        <span><i style="background:var(--bad)"></i>Still going backwards</span></div></div>`;

      x += `<div class="card"><h2>The numbers behind it</h2><div class="wrap"><table>
        <thead><tr><th>Site</th><th>Opened</th><th class="n">Months</th><th class="n">Build cost</th><th class="n">Profit since opening</th><th class="n">Still to earn</th><th class="n">Recovered</th><th class="n">${esc((M&&M.latest_label)||'Latest')}</th><th>At this rate</th></tr></thead><tbody>`;
      R.forEach(r=>{
        x += `<tr><td><b>${esc(r.code)}</b></td><td class="muted">${!r.start?'<span class="muted">unknown</span>':r.start_precision==='year'?esc(r.start.slice(0,4)):fmtY(r.start)}</td>
          <td class="n">${r.months_trading||'–'}</td><td class="n">${gbp(r.capex)}</td>
          <td class="n ${(r.profit_to_date||0)<0?'bad':''}">${gbp(r.profit_to_date)}</td>
          <td class="n">${r.done?'<span class="pill green">none</span>':gbp(r.outstanding)}</td>
          <td class="n ${(r.bep_pct||0)<0?'bad':''}">${r.done?'100%':(r.bep_pct==null?'–':r.bep_pct.toFixed(1)+'%')}</td>
          <td class="n">${r.run==null?'<span class="muted">–</span>':gbp(r.run)}</td>
          <td class="muted">${r.done?'paid back':(r.monthsLeftRun==null?'not earning yet':r.monthsLeftRun>120?`more than 10 years at ${(M&&M.latest_label)||'this month'}'s profit`:`${Math.ceil(r.monthsLeftRun)} months on ${(M&&M.latest_label)||'the latest month'}`)}</td></tr>`;
      });
      x += `<tr><th>Total</th><th></th><th></th><th class="n">${gbp(B.total_capex)}</th><th class="n"${(B.capped_codes||[]).length?` data-tip="£${Math.round(B.total_profit_on_record).toLocaleString('en-GB')} of profit on record, plus £${Math.round(B.capped_amount).toLocaleString('en-GB')} for ${esc((B.capped_codes||[]).join(', '))}, recorded as fully recovered."`:''}>${gbp(B.total_recovered)}</th><th class="n">${gbp(B.outstanding)}</th><th class="n">${B.percent_recovered.toFixed(1)}%</th><th></th><th></th></tr>`;
      x += `</tbody></table></div>
        <div class="src">"At this rate" divides what is left by that site's profit in ${esc((M&&M.latest_label)||'the latest month')}. That month is the Edinburgh Fringe, so for the Scottish sites it flatters the answer. The bar chart above uses each site's own monthly average instead, which is the steadier number.</div></div>`;

      const flagged = B.rows.filter(r=>r.sign_corrected || r.fully_recovered);
      x += `<div class="card"><h2>Read this before you act on a number</h2>`;
      flagged.forEach(r=>{ x += `<div class="li"><span class="pill amber">CHECK</span><div class="who">${esc(r.code)}</div><div class="what">${esc(r.sign_corrected || r.recovered_note)}</div></div>`; });
      (B.sites_without_capex||[]).length && (x += `<div class="li"><div class="who">${esc((B.sites_without_capex||[]).join(', '))}</div><div class="what muted">No build cost in the monthly analysis, so these sites are not in any total on this tab. They are the older sites plus Leeds, whose start-up budget is a link rather than a figure.</div></div>`);
      x += `<div class="li"><div class="who">All</div><div class="what muted">Profit since opening is Monica's cumulative figure from the analysis document, not a sum of this board's monthly management accounts. Where the two differ, hers is the one on this tab.</div></div></div>`;
      x += `</div>`;
      w.innerHTML = x;
      wireTips(w);
      fitTiles();
      w.querySelectorAll('.chip[data-show]').forEach(ch=>ch.onclick=()=>{ bf.show=ch.dataset.show; draw(); });
    }
    draw();
  })();

})();
</script>
</body>
</html>
